<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- the options' icons: other scripts name them by their Font Awesome classes -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css" />
    <!-- the look: MyCity_UI, loaded at runtime (never a dependency) -->
    <link rel="stylesheet" href="https://cfx-nui-MyCity_UI/dist/mc-base.css" />
    <link rel="stylesheet" href="https://cfx-nui-MyCity_UI/dist/mc.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cfx-nui-MyCity_UI/dist/mc.js"></script>
  </head>
  <body>
    <div class="mc-root">
      <div id="eye" class="mc-target"></div>
    </div>
    <!-- on the body, not in the click-through .mc-root: its choices take the click -->
    <div id="options" class="mc-menu mc-menu--split" hidden></div>
    <script src="js/main.js"></script>
  </body>
</html>
